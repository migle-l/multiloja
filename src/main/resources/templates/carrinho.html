<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Carrinho')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
  <div th:replace="~{fragments :: mensagens}"></div>
  <h1>Meu carrinho</h1>

  <p class="vazio" th:if="${carrinho.vazio}">Seu carrinho está vazio. <a th:href="@{/}">Ver produtos</a></p>

  <div th:unless="${carrinho.vazio}">
    <div class="tabela">
      <table>
        <thead><tr><th>Produto</th><th>Opção</th><th>Preço</th><th>Quantidade</th><th>Subtotal</th><th></th></tr></thead>
        <tbody>
          <tr th:each="i : ${carrinho.itens}">
            <td><a th:href="@{/produtos/{id}(id=${i.variacao.produto.id})}" th:text="${i.variacao.produto.nome}"></a><br>
                <small th:text="${i.variacao.produto.loja.nome}"></small></td>
            <td th:text="${i.variacao.descricao}"></td>
            <td th:text="${#numbers.formatCurrency(i.variacao.precoFinal)}"></td>
            <td>
              <form class="inline" th:action="@{/carrinho/itens/{id}/quantidade(id=${i.id})}" method="post">
                <input type="number" name="quantidade" min="0" th:value="${i.quantidade}" aria-label="Quantidade">
                <button type="submit">Atualizar</button>
              </form>
            </td>
            <td th:text="${#numbers.formatCurrency(i.subtotal)}"></td>
            <td><form th:action="@{/carrinho/itens/{id}/remover(id=${i.id})}" method="post"><button type="submit" class="link">Remover</button></form></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="duas-colunas" style="margin-top:16px">
      <section class="painel">
        <h2>Cupom de desconto</h2>
        <div th:if="${carrinho.cupom != null}">
          <p>Cupom <strong th:text="${carrinho.cupom.codigo}"></strong> aplicado
            (vale para a categoria <span th:text="${carrinho.cupom.categoria.nome}"></span>).</p>
          <form th:action="@{/carrinho/cupom/remover}" method="post"><button type="submit" class="link">Remover cupom</button></form>
        </div>
        <form th:if="${carrinho.cupom == null}" class="inline" th:action="@{/carrinho/cupom}" method="post">
          <input type="text" name="codigo" placeholder="Código do cupom" style="width:180px" aria-label="Código do cupom">
          <button type="submit">Aplicar</button>
        </form>
      </section>

      <section class="painel">
        <div class="totais">
          <div><span>Subtotal</span><span th:text="${#numbers.formatCurrency(carrinho.subtotal)}"></span></div>
          <div><span>Desconto</span><span th:text="'- ' + ${#numbers.formatCurrency(carrinho.desconto)}"></span></div>
          <div class="total"><span>Total</span><span th:text="${#numbers.formatCurrency(carrinho.total)}"></span></div>
        </div>
        <p style="text-align:right"><a class="botao" th:href="@{/checkout}">Finalizar pedido</a></p>
      </section>
    </div>
  </div>
</main>
</body>
</html>
