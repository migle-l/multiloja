<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Produto')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
  <div th:replace="~{fragments :: mensagens}"></div>
  <h1 th:text="${produtoId == null} ? 'Novo produto' : 'Gerenciar produto'">Produto</h1>
  <p><a th:href="@{/loja/produtos}">Voltar para a lista</a></p>

  <p class="aviso erro" th:if="${categorias.empty}">
    Crie uma <a th:href="@{/loja/categorias}">categoria</a> antes de cadastrar produtos.
  </p>

  <div class="duas-colunas">
    <section class="painel">
      <h2>Dados do produto</h2>
      <form th:action="${produtoId == null} ? @{/loja/produtos} : @{/loja/produtos/{id}(id=${produtoId})}"
            th:object="${form}" method="post" class="formulario">
        <div><label for="codigo">Código</label><input type="text" th:field="*{codigo}">
          <span class="erro" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span></div>
        <div><label for="nome">Nome</label><input type="text" th:field="*{nome}">
          <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span></div>
        <div><label for="descricao">Descrição</label><textarea th:field="*{descricao}" rows="3"></textarea></div>
        <div><label for="categoriaId">Categoria</label>
          <select th:field="*{categoriaId}">
            <option value="">Escolha...</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
          </select>
          <span class="erro" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></span></div>
        <div><label for="precoBase">Preço base (R$)</label><input type="number" step="0.01" min="0" th:field="*{precoBase}">
          <span class="erro" th:if="${#fields.hasErrors('precoBase')}" th:errors="*{precoBase}"></span></div>
        <div><label for="estoque">Estoque geral</label><input type="number" min="0" th:field="*{estoque}">
          <span class="erro" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span></div>
        <div><label class="opcao"><input type="checkbox" th:field="*{ativo}"> Visível na vitrine</label></div>
        <div><button type="submit" th:text="${produtoId == null} ? 'Criar produto' : 'Salvar alterações'">Salvar</button></div>
      </form>
    </section>

    <section class="painel" th:if="${produtoId != null}">
      <h2>Variações (cor e tamanho)</h2>
      <p class="ajuda" th:if="${produto.variacoes.empty}">Sem variações, o produto não pode ser comprado. Adicione a primeira abaixo.</p>
      <div class="tabela" th:unless="${produto.variacoes.empty}">
        <table>
          <thead><tr><th>Opção</th><th>Preço adicional</th><th>Estoque</th><th></th></tr></thead>
          <tbody>
            <tr th:each="v : ${produto.variacoes}">
              <td th:text="${v.descricao}"></td>
              <td colspan="3">
                <form class="inline" th:action="@{/loja/variacoes/{id}(id=${v.id})}" method="post">
                  <input type="number" step="0.01" min="0" name="precoAdicional" th:value="${v.precoAdicional}" aria-label="Preço adicional">
                  <input type="number" min="0" name="estoque" th:value="${v.estoque}" aria-label="Estoque">
                  <button type="submit">Salvar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <h2 style="margin-top:18px">Nova variação</h2>
      <form th:action="@{/loja/produtos/{id}/variacoes(id=${produtoId})}" th:object="${variacaoForm}" method="post" class="formulario">
        <div><label for="cor">Cor</label><input type="text" th:field="*{cor}"></div>
        <div><label for="tamanho">Tamanho</label><input type="text" th:field="*{tamanho}"></div>
        <div><label for="precoAdicional">Preço adicional (R$)</label><input type="number" step="0.01" min="0" th:field="*{precoAdicional}">
          <span class="erro" th:if="${#fields.hasErrors('precoAdicional')}" th:errors="*{precoAdicional}"></span></div>
        <div><label for="estoque">Estoque desta variação</label><input type="number" min="0" th:field="*{estoque}">
          <span class="erro" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span></div>
        <div><button type="submit">Adicionar variação</button></div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
