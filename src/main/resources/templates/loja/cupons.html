<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cupons')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
  <div th:replace="~{fragments :: mensagens}"></div>
  <h1>Cupons de desconto</h1>
  <div class="duas-colunas">
    <section class="painel">
      <h2>Seus cupons</h2>
      <p class="ajuda" th:if="${cupons.empty}">Nenhum cupom criado ainda.</p>
      <div class="tabela" th:unless="${cupons.empty}">
        <table>
          <thead><tr><th>Código</th><th>Categoria</th><th>Desconto</th><th>Validade</th><th>Situação</th><th></th></tr></thead>
          <tbody>
            <tr th:each="c : ${cupons}">
              <td th:text="${c.codigo}"></td>
              <td th:text="${c.categoria.nome}"></td>
              <td th:text="${c.tipo.name() == 'PERCENTUAL'} ? ${#numbers.formatDecimal(c.valor, 1, 0)} + '%' : ${#numbers.formatCurrency(c.valor)}"></td>
              <td th:text="${c.validade != null} ? ${#temporals.format(c.validade, 'dd/MM/yyyy')} : 'Sem prazo'"></td>
              <td th:text="${c.utilizavel} ? 'Ativo' : 'Inativo/expirado'"></td>
              <td>
                <form th:if="${c.ativo}" th:action="@{/loja/cupons/{id}/desativar(id=${c.id})}" method="post">
                  <button type="submit" class="link">Desativar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="painel">
      <h2>Novo cupom</h2>
      <p class="aviso erro" th:if="${categorias.empty}">Crie uma <a th:href="@{/loja/categorias}">categoria</a> primeiro: todo cupom vale para uma categoria.</p>
      <form th:action="@{/loja/cupons}" th:object="${form}" method="post" class="formulario">
        <div><label for="codigo">Código</label><input type="text" th:field="*{codigo}" placeholder="PROMO10">
          <span class="erro" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span></div>
        <div><label for="categoriaId">Vale para a categoria</label>
          <select th:field="*{categoriaId}">
            <option value="">Escolha...</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
          </select>
          <span class="erro" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></span></div>
        <div><label for="tipo">Tipo de desconto</label>
          <select th:field="*{tipo}"><option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></div>
        <div><label for="valor">Valor (% ou R$)</label><input type="number" step="0.01" min="0" th:field="*{valor}">
          <span class="erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span></div>
        <div><label for="validade">Válido até (opcional)</label><input type="date" th:field="*{validade}"></div>
        <div><button type="submit">Criar cupom</button></div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
