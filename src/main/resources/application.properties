spring.application.name=multiloja

# Banco H2 em arquivo (./data). Para PostgreSQL, troque url/driver e a dependência no pom.xml
spring.datasource.url=jdbc:h2:file:./data/multiloja;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console