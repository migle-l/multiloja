spring.application.name=multiloja

# Banco de dados PostgreSQL. Os valores abaixo são os padrões do docker-compose.yml
# e do scripts/criar-banco.sql; podem ser trocados por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiloja}
spring.datasource.username=${DB_USER:multiloja}
spring.datasource.password=${DB_PASSWORD:multiloja}

# Hibernate cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
